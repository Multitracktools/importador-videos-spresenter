name: Gerar versão

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  plugin:
    name: Plugin do Spresenter
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: plugin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - run: npm ci
      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-spresenter
          path: plugin/release/*.zip
          if-no-files-found: error

  auxiliar:
    name: Auxiliar ${{ matrix.nome }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Windows
            os: windows-latest
            comando: npm run dist:win

          - nome: macOS
            os: macos-latest
            comando: npm run dist:mac

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: auxiliar

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auxiliar/package-lock.json

      - run: npm ci
      - run: ${{ matrix.comando }}

      - uses: actions/upload-artifact@v4
        with:
          name: auxiliar-${{ matrix.nome }}
          path: |
            auxiliar/release/*.exe
            auxiliar/release/*.dmg
          if-no-files-found: error

  publicar:
    name: Publicar no GitHub Releases

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - plugin
      - auxiliar

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: arquivos/**/*
