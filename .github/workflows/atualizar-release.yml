name: Atualizar descrição da release

on:
  push:
    branches:
      - 'feat/pixabay-search'
    paths:
      - '.github/workflows/atualizar-release.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar instruções da v0.3.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: |
            ## Importador de Vídeos para Spresenter

            Esta versão permite importar vídeos por link do YouTube e pesquisar fundos gratuitos diretamente no Pixabay e no Pexels.

            ### Novidades da versão 0.3.3

            - Pesquisa independente no Pixabay e no Pexels.
            - Somente vídeos horizontais (landscape), adequados para projeção.
            - Seleção de resolução: HD 720p, Full HD 1080p, 4K 2160p ou melhor disponível.
            - Exibição dos resultados em 2, 3, 4 ou 5 colunas.
            - Download e inclusão direta na categoria Fundos do Spresenter.
            - Chaves das APIs armazenadas somente no computador do usuário.
            - Informações de licença e crédito dos autores.

            ## Arquivos para baixar

            ### Windows

            1. Baixe e instale **Auxiliar-Importador-Spresenter-Windows-0.3.3.exe**.
            2. Baixe **com.comunidade.spresenter.importador-videos-0.3.3.zip** para instalar dentro do Spresenter.

            ### macOS com Apple Silicon

            1. Baixe **Auxiliar-Importador-Spresenter-macOS-arm64-0.3.3.dmg**.
            2. Baixe **com.comunidade.spresenter.importador-videos-0.3.3.zip**.

            Use esta opção em Macs com processadores M1, M2, M3, M4 ou posteriores.

            ### macOS com processador Intel

            1. Baixe **Auxiliar-Importador-Spresenter-macOS-x64-0.3.3.dmg**.
            2. Baixe **com.comunidade.spresenter.importador-videos-0.3.3.zip**.

            ## Como instalar

            1. Se existir uma versão anterior do auxiliar aberta, encerre-a pelo ícone próximo ao relógio do Windows ou pela barra de menus do macOS.
            2. Instale e abra o auxiliar correspondente ao seu sistema.
            3. Abra o Spresenter.
            4. Entre em **Configurações → Plugins → Instalar**.
            5. Selecione o arquivo **com.comunidade.spresenter.importador-videos-0.3.3.zip** sem descompactá-lo.
            6. Abra o painel **Importador de Vídeos** e confirme que aparece **Auxiliar conectado**.

            Ao atualizar uma instalação existente, as chaves das APIs permanecem guardadas na pasta local do auxiliar.

            ## Configuração das pesquisas

            ### Pixabay

            1. Crie gratuitamente sua chave em https://pixabay.com/api/docs/
            2. Abra a aba **Pesquisar no Pixabay**.
            3. Cole e salve sua chave pessoal.

            ### Pexels

            1. Crie gratuitamente sua chave em https://www.pexels.com/api/
            2. Abra a aba **Pesquisar no Pexels**.
            3. Cole e salve sua chave pessoal.

            As chaves não são incluídas no plugin, não são publicadas no GitHub e ficam somente no computador do usuário.

            ## Observação para macOS

            Como o auxiliar ainda não possui assinatura e notarização da Apple, o macOS pode avisar que o desenvolvedor não foi identificado. Se isso acontecer, use **Ajustes do Sistema → Privacidade e Segurança → Abrir Mesmo Assim**.

            ## Uso responsável

            Use apenas vídeos próprios, gratuitos, em domínio público ou para os quais você tenha autorização. Respeite as licenças e os termos das plataformas de origem.

            **Código-fonte e histórico completo:** https://github.com/Multitracktools/importador-videos-spresenter/commits/v0.3.3
        run: gh api --method PATCH repos/Multitracktools/importador-videos-spresenter/releases/384938271 --raw-field body="$RELEASE_BODY"
